<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="KidsPlay - a fun, safe coloring site for children." />
    <title>{% block title %}KidsPlay — Coloring Fun{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ url_for('index') }}">
        <span class="brand-icon">🎨</span>
        <span>KidsPlay</span>
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ url_for('index') }}">Home</a>
        <a href="{{ url_for('index') }}#gallery">Pictures</a>
        <a href="{{ url_for('index') }}#how-to">How to Play</a>
      </nav>
    </header>

    <main>{% block content %}{% endblock %}</main>

    <footer class="site-footer">
      <p>Made with 💛 for little artists. Click a color, click a picture, and have fun!</p>
    </footer>

    <script src="{{ url_for('static', filename='js/coloring.js') }}" defer></script>
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
  </body>
</html>
